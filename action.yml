name: envguard
description: Validate .env files or the process environment against an annotated .env.example
author: Amr Abd-Rabou
branding:
  icon: shield
  color: green

inputs:
  env:
    description: Env file to validate. Ignored when process-env is true.
    required: false
    default: .env
  example:
    description: Example file that declares the variables.
    required: false
    default: .env.example
  process-env:
    description: Validate the job's environment variables instead of a file. Set the variables with the step's `env:` block.
    required: false
    default: 'false'
  strict:
    description: Treat warnings as errors.
    required: false
    default: 'false'
  args:
    description: Extra arguments passed to `envguard check`, separated by spaces.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Runs the copy of envguard that ships with this action, so the version
    # always matches the ref in `uses:` and nothing is downloaded from npm.
    # Needs Node.js 18+ on the runner; GitHub-hosted runners include it.
    - name: Run envguard
      shell: bash
      run: |
        args=(check --example "$INPUT_EXAMPLE" --no-color)
        if [ "$INPUT_PROCESS_ENV" = "true" ]; then args+=(--process-env); else args+=(--env "$INPUT_ENV"); fi
        if [ "$INPUT_STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$INPUT_ARGS" ]; then
          read -r -a extra <<< "$INPUT_ARGS"
          args+=("${extra[@]}")
        fi
        node "$ACTION_PATH/bin/envguard.js" "${args[@]}"
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_EXAMPLE: ${{ inputs.example }}
        INPUT_PROCESS_ENV: ${{ inputs.process-env }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_ARGS: ${{ inputs.args }}
