name: envguard
description: Validate .env files or the process environment against an annotated .env.example
author: Amr Abd-Rabou
branding:
  icon: shield
  color: green

inputs:
  env:
    description: Env file to validate. Ignored when process-env is true.
    required: false
    default: .env
  example:
    description: Example file that declares the variables.
    required: false
    default: .env.example
  process-env:
    description: Validate the job's environment variables instead of a file. Set the variables with the step's `env:` block.
    required: false
    default: 'false'
  strict:
    description: Treat warnings as errors.
    required: false
    default: 'false'
  version:
    description: envguard version to run from npm.
    required: false
    default: latest
  args:
    description: Extra arguments passed to `envguard check`.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run envguard
      shell: bash
      run: |
        args=(check --example "$INPUT_EXAMPLE" --no-color)
        if [ "$INPUT_PROCESS_ENV" = "true" ]; then args+=(--process-env); else args+=(--env "$INPUT_ENV"); fi
        if [ "$INPUT_STRICT" = "true" ]; then args+=(--strict); fi
        # shellcheck disable=SC2206
        args+=($INPUT_ARGS)
        npx --yes "envguard@$INPUT_VERSION" "${args[@]}"
      env:
        INPUT_ENV: ${{ inputs.env }}
        INPUT_EXAMPLE: ${{ inputs.example }}
        INPUT_PROCESS_ENV: ${{ inputs.process-env }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ARGS: ${{ inputs.args }}
